<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AreYouSyrious — Map</title>
<meta name="description" content="Every place named in the AreYouSyrious daily digests, 2016–2025, with the stories and photos that mention it.">
<style>
  :root{--bg:#06070a;--fg:#e9e6e0;--mut:#8d887e;--lin:#2c3138;--red:#c8372d;--panel:#0d0e11;--bord:#23262b;--topo:92px}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.5 ui-sans-serif,system-ui,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
  body{display:grid;grid-template-rows:auto auto 1fr;height:100vh;height:100dvh}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;cursor:pointer}
  .topo{display:flex;align-items:center;gap:1rem;padding:.55rem 1rem;border-bottom:1px solid var(--bord);flex-wrap:wrap}
  .topo .marca{font:700 12px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
  .topo h1{margin:0;font:400 20px/1.2 Georgia,"Times New Roman",serif;letter-spacing:.01em}
  .topo nav{margin-left:auto;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
  .topo nav a,.btn{border:1px solid #3a3733;border-radius:3px;padding:.4rem .65rem;min-height:34px;display:inline-flex;align-items:center;font:600 12px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.06em;color:#bdb7ab;background:rgba(20,19,17,.7)}
  .topo nav a:hover,.btn:hover,.btn:focus-visible,.topo nav a:focus-visible{color:#fff;border-color:#8a847a;outline:none}
  .anos{display:flex;gap:.9rem;align-items:center;padding:.35rem 1rem .3rem;border-bottom:1px solid var(--bord);white-space:nowrap}
  .anos .rot{font:600 11px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
  .anos .todos{background:transparent;border:1px solid #2f2d29;border-radius:999px;padding:.35rem .8rem;min-height:32px;font:600 12px/1 ui-sans-serif,system-ui,sans-serif;color:#9d978c;cursor:pointer}
  .anos .todos:hover,.anos .todos:focus-visible{color:#fff;border-color:#8a847a;outline:none}
  .anos .todos[aria-pressed=true]{background:#e9e6e0;color:#0b0b0b;border-color:#e9e6e0}
  /* slider de anos: trilho fino, o trecho até o ano escolhido aceso (as cercas acesas são as erguidas até ali) */
  .reg{--th:16px;position:relative;flex:1;min-width:0;max-width:720px;height:44px}
  .reg input{position:absolute;z-index:1;left:0;right:0;top:0;width:100%;height:26px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;touch-action:pan-y}
  .reg input:focus{outline:none}
  .reg input::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:linear-gradient(90deg,#c9c3b7 var(--f,0%),#34312d var(--f,0%))}
  .reg input::-moz-range-track{height:2px;border-radius:2px;background:linear-gradient(90deg,#c9c3b7 var(--f,0%),#34312d var(--f,0%))}
  .reg input::-webkit-slider-thumb{-webkit-appearance:none;width:var(--th);height:var(--th);margin-top:calc(1px - var(--th) / 2);border-radius:50%;background:#e9e6e0;border:3px solid #0b0b0b;box-shadow:0 0 0 1px #8a847a}
  .reg input::-moz-range-thumb{width:var(--th);height:var(--th);border-radius:50%;background:#e9e6e0;border:3px solid #0b0b0b;box-shadow:0 0 0 1px #8a847a}
  .reg input:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 2px #fff}
  .reg input:focus-visible::-moz-range-thumb{box-shadow:0 0 0 2px #fff}
  .reg.livre input::-webkit-slider-thumb{background:#0b0b0b;box-shadow:0 0 0 1px #5d5952}
  .reg.livre input::-moz-range-thumb{background:#0b0b0b;box-shadow:0 0 0 1px #5d5952}
  .reg .marcas{position:absolute;left:0;right:0;top:22px;height:22px}
  .reg .marcas button{position:absolute;top:0;transform:translateX(-50%);background:transparent;border:0;padding:3px 2px;min-height:0;font:600 11px/1 ui-sans-serif,system-ui,sans-serif;color:#6f6a62;cursor:pointer;font-variant-numeric:tabular-nums}
  .reg .marcas button::before{content:"";position:absolute;left:50%;top:-6px;width:1px;height:4px;background:#3a3733}
  .reg .marcas .ct{display:none}
  .reg .marcas button:hover{color:#e9e6e0}
  .reg .marcas button[aria-pressed=true]{color:#f2efe8}
  .reg .marcas button[aria-pressed=true]::before{background:#c9c3b7}
  .anos .tot{margin-left:auto;padding-left:1rem;font:12px/1 ui-sans-serif,system-ui,sans-serif;color:var(--mut)}
  .campo{position:relative;min-height:0;overflow:hidden}
  .topo nav .ic{width:15px;height:15px;flex:0 0 auto;margin-right:.45rem;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .topo nav .ic circle,.topo nav .ic .ch{fill:currentColor}
  .topo nav .ic .oc{fill:#0b0b0b}
  /* arrastar o mapa não seleciona os nomes dos lugares */
  #mapa,#mapa *,.leg,.zoom{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #mapa{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--bg)}
  #mapa.arrasta{cursor:grabbing}
  .m-terra{fill:#15181c;stroke:#2c3138;stroke-width:.8px;vector-effect:non-scaling-stroke}
  .m-lin{fill:none;stroke:#3b3f46;stroke-width:.7px;vector-effect:non-scaling-stroke}
  .m-ext{fill:none;stroke:#7a3a36;stroke-width:1.2px;vector-effect:non-scaling-stroke}
  .m-cerca{fill:none;stroke:#c8372d;stroke-width:2px;vector-effect:non-scaling-stroke;opacity:0;transition:opacity .6s ease}
  .m-cerca.on{opacity:.95}
  .m-anel{fill:none;stroke:#c8372d;stroke-width:1.6px;vector-effect:non-scaling-stroke;opacity:0;transition:opacity .6s ease}
  .m-encl.on .m-anel{opacity:.95}
  /* fronteiras clicáveis: traço largo invisível para o toque, traço fino que acende no hover e na seleção */
  .m-b{cursor:pointer}
  .m-b:focus{outline:none}
  .m-bh{fill:none;stroke:transparent;stroke-width:14px;vector-effect:non-scaling-stroke;pointer-events:stroke}
  .m-bv{fill:none;stroke:transparent;stroke-width:2.4px;vector-effect:non-scaling-stroke;pointer-events:none;transition:stroke .15s ease}
  .m-b:hover .m-bv,.m-b:focus-visible .m-bv{stroke:rgba(233,230,224,.55)}
  .m-b.sel .m-bv{stroke:#f2efe8;stroke-width:3px}
  .ph .cruz{display:flex;flex-wrap:wrap;gap:.35rem;margin:.55rem 0 .1rem}
  .ph .cruz:empty{display:none}
  .ph .cruz button{background:transparent;border:1px solid #3a3733;border-radius:999px;padding:.3rem .65rem;min-height:30px;font:600 12px/1 ui-sans-serif,system-ui,sans-serif;color:#cfcac0;cursor:pointer}
  .ph .cruz button span{color:var(--mut);font-weight:400;margin-left:.35rem}
  .ph .cruz button:hover,.ph .cruz button:focus-visible{color:#fff;border-color:#8a847a;outline:none}
  .m-rot{fill:#5d636b;font:600 11px ui-sans-serif,system-ui,sans-serif;font-variant:small-caps;letter-spacing:.14em;pointer-events:none;text-anchor:middle}
  .m-rot.mar{fill:#454b55;font-style:italic}
  .pt{fill:rgba(217,212,200,.5);stroke:#d9d4c8;stroke-width:1px;vector-effect:non-scaling-stroke;cursor:pointer}
  .pt.mar{fill:rgba(154,161,169,.22);stroke:#9aa1a9}
  .pt.pais{fill:none;stroke:#a7a195;stroke-width:1.6px;stroke-dasharray:none}
  .pt:focus{outline:none}
  .pt:hover{fill:rgba(255,255,255,.8)}
  .pt:focus-visible{stroke:#fff;stroke-width:2.6px}
  .pt.pais:hover,.pt.pais:focus-visible{fill:rgba(255,255,255,.12)}
  .pt.sel{stroke:#fff;stroke-width:2.6px;fill:rgba(255,255,255,.75)}
  .pt.pais.sel{fill:rgba(255,255,255,.14)}
  .alvo{fill:none;stroke:transparent;pointer-events:none}
  .rotulo{fill:#d6d1c6;font:600 11px ui-sans-serif,system-ui,sans-serif;paint-order:stroke;stroke:#06070a;stroke-width:3px;stroke-linejoin:round;pointer-events:none;vector-effect:non-scaling-stroke}
  .zoom{position:absolute;left:.7rem;top:.7rem;display:flex;flex-direction:column;gap:.3rem;z-index:3}
  .zoom button{width:38px;height:38px;border:1px solid #3a3733;border-radius:3px;background:rgba(20,19,17,.85);color:#cfcac0;font:600 20px/1 ui-sans-serif,system-ui,sans-serif}
  .zoom button:hover,.zoom button:focus-visible{color:#fff;border-color:#8a847a;outline:none}
  .leg{position:absolute;left:.7rem;bottom:.6rem;z-index:2;font:11.5px/1.5 ui-sans-serif,system-ui,sans-serif;color:var(--mut);max-width:36rem;pointer-events:none}
  .leg i{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:.3rem}
  .leg .d{background:rgba(217,212,200,.5);border:1px solid #d9d4c8}
  .leg .a{border:1.5px solid #a7a195}
  .leg .r{width:14px;height:0;border-radius:0;border-top:2px solid var(--red);vertical-align:3px}
  /* painel do lugar: lateral no desktop, folha de baixo no celular */
  #painel{position:absolute;top:0;right:0;bottom:0;width:min(420px,92vw);background:var(--panel);border-left:1px solid var(--bord);z-index:5;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .3s ease;visibility:hidden}
  #painel.on{transform:none;visibility:visible}
  .ph{padding:1rem 1rem .7rem;border-bottom:1px solid var(--bord);position:relative}
  .ph h2{margin:0 2.4rem .15rem 0;font:400 24px/1.2 Georgia,"Times New Roman",serif}
  .ph .sub{font:12px/1.4 ui-sans-serif,system-ui,sans-serif;color:var(--mut);letter-spacing:.04em}
  .ph .fecha{position:absolute;right:.6rem;top:.6rem;width:38px;height:38px;border:1px solid #3a3733;border-radius:3px;background:transparent;color:#bdb7ab;font-size:20px;line-height:1}
  .ph .lin{display:flex;gap:.5rem;align-items:center;margin-top:.7rem;flex-wrap:wrap}
  .ph select{background:#15161a;color:var(--fg);border:1px solid #3a3733;border-radius:3px;padding:.4rem .5rem;min-height:34px;font:600 12px ui-sans-serif,system-ui,sans-serif}
  .lista{overflow-y:auto;flex:1;min-height:0;padding:.2rem 1rem 1.2rem;-webkit-overflow-scrolling:touch}
  .post{padding:.8rem 0;border-bottom:1px solid #1a1c20}
  .post time{display:block;font:600 11px/1.2 ui-sans-serif,system-ui,sans-serif;letter-spacing:.1em;color:var(--mut);margin-bottom:.2rem}
  .post .t{font:400 16px/1.35 Georgia,"Times New Roman",serif;color:#efece5}
  .post .t:hover{text-decoration:underline;text-underline-offset:2px}
  .post .r{font:13px/1.4 ui-sans-serif,system-ui,sans-serif;color:#9d978c;margin-top:.2rem}
  .fotos{display:flex;gap:4px;margin-top:.5rem}
  .fotos a{display:block;width:64px;height:64px;background:#15161a;border-radius:2px;overflow:hidden}
  .fotos img{width:100%;height:100%;object-fit:cover;display:block}
  .mais{display:block;width:100%;margin:1rem 0 0;padding:.7rem;border:1px solid #3a3733;border-radius:3px;background:rgba(20,19,17,.7);color:#bdb7ab;font:600 12px ui-sans-serif,system-ui,sans-serif;letter-spacing:.06em}
  .vazio{color:var(--mut);padding:1rem 0;font-size:14px}
  /* índice em lista */
  #indice{position:absolute;top:0;left:0;bottom:0;width:min(340px,92vw);background:var(--panel);border-right:1px solid var(--bord);z-index:6;display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .3s ease;visibility:hidden}
  #indice.on{transform:none;visibility:visible}
  #indice .ih{padding:.8rem 1rem;border-bottom:1px solid var(--bord);display:flex;gap:.5rem}
  #indice input{flex:1;min-width:0;background:#15161a;color:var(--fg);border:1px solid #3a3733;border-radius:3px;padding:.5rem .65rem;min-height:38px;font:14px ui-sans-serif,system-ui,sans-serif}
  #indice .fecha{width:38px;height:38px;border:1px solid #3a3733;border-radius:3px;background:transparent;color:#bdb7ab;font-size:20px;line-height:1}
  #indice .corpo{overflow-y:auto;flex:1;min-height:0;padding:0 .4rem 1rem}
  #indice h3{margin:.9rem .6rem .2rem;font:700 11px/1.2 ui-sans-serif,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
  #indice li{list-style:none}
  #indice ul{margin:0;padding:0}
  #indice li button{display:flex;justify-content:space-between;gap:.6rem;width:100%;text-align:left;background:transparent;border:0;border-radius:3px;padding:.45rem .6rem;min-height:36px;color:#d6d1c6;font-size:14px}
  #indice li button:hover,#indice li button:focus-visible{background:#1a1c20;outline:none}
  #indice li button span{color:var(--mut);font-variant-numeric:tabular-nums}
  #indice li.so{display:none}
  #indice .nada{padding:1rem .6rem;color:var(--mut);font-size:14px}
  #bv{position:absolute;left:.7rem;bottom:3.6rem;z-index:4;max-width:24rem;background:rgba(13,14,17,.94);border:1px solid var(--bord);border-radius:3px;padding:.8rem 2.6rem .8rem .9rem;font:400 15px/1.45 Georgia,"Times New Roman",serif;color:#cfcac0;opacity:0;transition:opacity 1.2s ease 1s}
  #bv.on{opacity:1}
  #bv[hidden]{display:none}
  #bv button{position:absolute;right:.2rem;top:.2rem;width:36px;height:36px;border:0;background:transparent;color:#8d887e;font-size:18px}
  #veu{position:fixed;inset:0;z-index:50;background:#000;opacity:1;transition:opacity 1.6s ease;pointer-events:none}
  #veu.fora{opacity:0}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  /* celular (em pé ou deitado): menu compacto de uma linha, alvos de 44 px, barra de anos com indicação de que há mais */
  @media (max-width:720px), (pointer:coarse) and (max-height:500px){
    .topo{gap:.5rem;padding:max(.1rem,env(safe-area-inset-top)) max(.5rem,env(safe-area-inset-right)) .1rem max(.5rem,env(safe-area-inset-left));flex-wrap:nowrap}
    .topo .marca,.topo h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
    .topo nav{margin:0;flex:1;display:flex;justify-content:space-between;gap:.25rem;flex-wrap:nowrap}
    .topo nav a,.topo nav .btn{flex-direction:column;gap:.2rem;line-height:1}
    .topo nav .ic{margin-right:0;width:16px;height:16px}
    .topo nav a,.btn{min-height:44px;min-width:44px;justify-content:center;padding:0 .55rem;font-size:14px;border-color:transparent;background:transparent;letter-spacing:.04em}
    .topo nav a.sec{display:inline-flex}
    .topo nav #abre-indice{order:9;border-color:#3a3733;background:rgba(20,19,17,.7);color:#e9e6e0}
    .anos{padding:0 max(.6rem,env(safe-area-inset-right)) 0 max(.6rem,env(safe-area-inset-left));gap:.6rem}
    .anos .rot,.anos .tot{display:none}
    .anos .todos{min-height:44px;min-width:48px;padding:0 .8rem;font-size:14px;border-radius:22px;flex:0 0 auto}
    .reg{--th:22px;height:62px}
    .reg input{height:44px}
    .reg .marcas{top:38px;height:22px}
    .reg .marcas button{font-size:14px;padding:2px 1px}
    .reg .marcas button::before{top:-4px}
    .reg .marcas .lg{display:none}
    .reg .marcas .ct{display:inline}
    .zoom{left:max(.5rem,env(safe-area-inset-left))}
    .zoom button{width:44px;height:44px}
    .ph .fecha,#indice .fecha,#bv button{width:44px;height:44px}
    .ph .fecha{right:.3rem;top:.3rem}
    .ph select,.ph .btn{min-height:44px;font-size:16px}
    .ph .btn{font-size:14px;border-color:#3a3733;padding:0 .8rem}
    .ph .sub{font-size:14px}
    .post time{font-size:13px}
    .post .t{display:inline-block;padding:.15rem 0}
    .post .r{font-size:14px}
    .mais{min-height:44px;font-size:14px}
    #indice input{font-size:16px;min-height:44px}
    #indice li button{min-height:44px;font-size:15px}
    #indice h3{font-size:13px}
    #indice .corpo{padding-bottom:calc(1rem + env(safe-area-inset-bottom))}
    #indice{padding-left:env(safe-area-inset-left)}
    .lista{padding-bottom:calc(1.2rem + env(safe-area-inset-bottom));padding-right:max(1rem,env(safe-area-inset-right))}
    .leg{display:none}
    .m-bh{stroke-width:22px}
    .ph .cruz button{min-height:44px;font-size:14px;padding:0 .8rem}
    .pt{fill:rgba(217,212,200,.32)}
    .pt.sel{fill:rgba(255,255,255,.75)}
    .m-rot{font-size:12px}
  }
  @media (max-width:720px){
    .topo h1{font-size:17px}
    #painel{top:auto;left:0;right:0;width:auto;max-height:62vh;max-height:62dvh;height:62vh;height:62dvh;border-left:0;border-top:1px solid #3a3733;border-radius:12px 12px 0 0;transform:translateY(102%);padding-bottom:env(safe-area-inset-bottom)}
    #painel.on{transform:none}
    .ph{padding:.8rem 3.4rem .6rem .9rem}
    .ph h2{font-size:21px;margin-right:0}
    #bv{left:max(.5rem,env(safe-area-inset-left));right:max(.5rem,env(safe-area-inset-right));bottom:max(.6rem,env(safe-area-inset-bottom));max-width:none}
    #indice{width:100%}
  }
  @media (prefers-reduced-motion:reduce){#painel,#indice,.m-cerca,#veu,#bv{transition:none!important}}
</style>

<body>
<div id="veu" aria-hidden="true"></div>
<header class="topo">
  <a class="marca" href="index.html">AreYouSyrious</a>
  <h1>Map</h1>
  <nav>
    <button class="btn" id="abre-indice" type="button" aria-controls="indice" aria-expanded="false"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M5 4h9M5 8h9M5 12h9"/><circle cx="2" cy="4" r=".6"/><circle cx="2" cy="8" r=".6"/><circle cx="2" cy="12" r=".6"/></svg><span>Index</span></button>
    <a class="sec" href="index.html"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><rect x="1.5" y="2.5" width="13" height="3.5" rx=".6"/><path d="M2.5 6v7.5h11V6M6.5 9h3"/></svg><span>Archive</span></a>
    <a class="sec" href="timeline.html"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M1.5 8h13"/><circle class="oc" cx="4" cy="8" r="1.6"/><circle class="oc" cx="8.5" cy="8" r="1.6"/><circle cx="12.5" cy="8" r="1.6"/></svg><span>Timeline</span></a>
    <a class="sec" href="tour/"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><rect x="1.5" y="3" width="13" height="10" rx="1.2"/><path d="M6.5 5.8v4.4L10.3 8z" class="ch"/></svg><span>Tour</span></a>
  </nav>
</header>
<div class="anos" id="anos" role="group" aria-label="Filter by year"><span class="rot">Year</span></div>
<main class="campo" id="campo">
  <svg id="mapa" role="img" aria-label="Map of Europe and the Mediterranean with every place named in the archive"></svg>
  <div class="zoom"><button id="z-mais" type="button" aria-label="Zoom in">+</button><button id="z-menos" type="button" aria-label="Zoom out">−</button></div>
  <div class="leg"><i class="d"></i>place &nbsp;<i class="a"></i>only the country is named &nbsp;·&nbsp; size = number of posts &nbsp;·&nbsp; <i class="r"></i>fenced borders &nbsp;·&nbsp; click a border for its crossings</div>
  <div id="bv" hidden><span id="bv-txt"></span><button type="button" aria-label="Dismiss">×</button></div>
  <aside id="indice" aria-label="Index of places">
    <div class="ih"><input id="busca" type="search" placeholder="Search a place" autocomplete="off" aria-label="Search a place"><button class="fecha" type="button" aria-label="Close index">×</button></div>
    <div class="corpo" id="indice-corpo"></div>
  </aside>
  <aside id="painel" aria-label="Posts that mention this place" aria-live="polite">
    <div class="ph">
      <button class="fecha" type="button" aria-label="Close">×</button>
      <h2 id="p-nome"></h2>

  const marcas = document.createElement('div'); marcas.className = 'marcas';
  const A0 = ANOS[0], NA = ANOS[ANOS.length - 1] - A0 || 1;
  const posAno = a => `calc(var(--th) / 2 + ${(a - A0) / NA} * (100% - var(--th)))`;   // o centro do polegar em cada ano
  for (const a of ANOS) {
    const b = document.createElement('button'); b.type = 'button'; b.dataset.ano = a; b.setAttribute('aria-label', a);
    b.innerHTML = `<span class="lg">${a}</span><span class="ct">${String(a).slice(2)}</span>`;   // celular: 16 a 25, em 14 px

    b.setAttribute('aria-pressed', 'false'); b.style.left = posAno(a); b.onclick = () => defineAno(a); marcas.appendChild(b);
  }
  reg.append(rng, marcas); chips.appendChild(reg);
  const doSlider = () => { if (+rng.value !== ano) defineAno(+rng.value); };   // change: tocar no polegar parado em 2025 com "All" ativo também filtra
  rng.addEventListener('input', doSlider); rng.addEventListener('change', doSlider);
  const tot = document.createElement('span'); tot.className = 'tot'; chips.appendChild(tot);
  function defineAno(a, hash = true) {
    ano = a;
    chips.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.ano === '' ? null : +b.dataset.ano) === ano)));
    acendeCercas(); aplica(); atualizaIndice(); atualizaTotais();
    reg.classList.toggle('livre', !ano);
    if (ano) rng.value = ano;
    rng.setAttribute('aria-valuetext', ano ? String(ano) : 'All years');
    rng.style.setProperty('--f', ano ? `calc(var(--th) / 2 + ${(ano - A0) / NA} * (100% - var(--th)))` : '0%');
    if (sel || selB) { montaPainel(false); }
    if (hash) fazHash();
  }
  function atualizaTotais() {
    const ps = new Set(); let n = 0;
    for (const l of L) { const c = cont(l); if (c) { n++; for (const e of l.pp) if (!ano || anoPost[e[0]] === ano) ps.add(e[0]); } }

  }

  /* ---- painel do lugar ---- */
  const PAG = 25;
  let mostrados = 0, lista = [];
  const fotoSrc = [r => `thumbs/assets/${r}`, r => `assets/${r}`, r => `https://miro.medium.com/v2/resize:fit:160/${r.split('/')[1]}`];
  function foto(ref) {
    const im = new Image(); im.loading = 'lazy'; im.decoding = 'async'; im.alt = ''; im.width = 64; im.height = 64;
    let i = 0; im.onerror = () => { i++; if (i < fotoSrc.length) im.src = fotoSrc[i](ref); else im.parentNode && im.remove(); };
    im.src = fotoSrc[0](ref); return im;
  }
  const dataTxt = iso => new Date(iso + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  function linha(e) {
    const [stem, d, titulo, resumo] = D.posts[e[0]], href = `post.html?p=${encodeURIComponent(stem)}.md`;
    const a = document.createElement('article'); a.className = 'post';
    const t = document.createElement('time'); t.dateTime = d; t.textContent = dataTxt(d);
    const ln = document.createElement('a'); ln.className = 't'; ln.href = href; ln.textContent = titulo;
    a.append(t, ln);
    if (resumo) { const r = document.createElement('div'); r.className = 'r'; r.textContent = resumo; a.appendChild(r); }
    if (e.length > 1) {
      const f = document.createElement('div'); f.className = 'fotos';
      for (const ix of e.slice(1)) { const l = document.createElement('a'); l.href = href; l.tabIndex = -1; l.setAttribute('aria-hidden', 'true'); l.appendChild(foto(D.imgs[ix])); f.appendChild(l); }
      a.appendChild(f);
    }
    return a;
  }
  function maisLinhas() {
    const box = $('p-lista'); box.querySelector('.mais')?.remove();
    const fim = Math.min(lista.length, mostrados + PAG);
    const frag = document.createDocumentFragment();
    for (let i = mostrados; i < fim; i++) frag.appendChild(linha(lista[i]));
    box.appendChild(frag); mostrados = fim;
    if (mostrados < lista.length) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'mais';
      b.textContent = `Show ${Math.min(PAG, lista.length - mostrados)} more (${(lista.length - mostrados).toLocaleString('en-US')} left)`;
      b.onclick = maisLinhas; box.appendChild(b);
    }
  }
  function montaPainel(rolaTopo) {
    if (selB) return montaPainelB(rolaTopo);
    $('p-cruz').textContent = '';
    const l = byId(sel); if (!l) return;
    lista = l.pp.filter(e => !ano || anoPost[e[0]] === ano);       // já em ordem cronológica
    $('p-nome').textContent = l.n;
    const n = lista.length;
    $('p-sub').textContent = `${l.p !== '-' && l.t !== 'pais' ? l.p + ' · ' : l.t === 'pais' ? '' : ''}${TIPO[l.t]} · ${n.toLocaleString('en-US')} post${n === 1 ? '' : 's'}${ano ? ' in ' + ano : ''}${ano ? ` (${l.c.toLocaleString('en-US')} in all years)` : ''}`;
    const s = $('p-ano'); s.innerHTML = '';
    const o0 = new Option(`All years (${l.c})`, ''); s.add(o0);
    for (const a of ANOS) if (l.cy[a]) s.add(new Option(`${a} (${l.cy[a]})`, a));
    s.value = ano ? String(ano) : '';
    const box = $('p-lista'); box.textContent = ''; mostrados = 0;
    if (!n) { box.innerHTML = '<p class="vazio">No posts for this place in the selected year.</p>'; return; }
    maisLinhas();
    if (rolaTopo) box.scrollTop = 0;
  }
  function montaPainelB(rolaTopo) {
    const b = porB[selB]; if (!b) return;
    lista = b.pp.filter(e => !ano || anoPost[e[0]] === ano);
    const n = lista.length, k = b.cruz.length;
    $('p-nome').textContent = b.n;
    const partes = [b.encl ? 'enclave border' : 'border'];
    if (b.cerca) partes.push(`fenced since ${b.cerca}`);
    if (k) partes.push(`${n.toLocaleString('en-US')} post${n === 1 ? '' : 's'}${ano ? ' in ' + ano : ''} naming ${b.encl ? 'it' : `its ${k === 1 ? 'crossing point' : k + ' crossing points'}`}`);
    $('p-sub').textContent = partes.join(' · ');
    const cz = $('p-cruz'); cz.textContent = '';
    if (!b.encl) for (const l of b.cruz) {
      const bt = document.createElement('button'); bt.type = 'button'; bt.textContent = l.n;
      const sp = document.createElement('span'); sp.textContent = cont(l).toLocaleString('en-US'); bt.appendChild(sp);
      bt.setAttribute('aria-label', `${l.n}, ${l.p}: ${cont(l)} posts`); bt.onclick = () => abre(l.id, true); cz.appendChild(bt);
    }
    const s = $('p-ano'); s.innerHTML = '';
    s.add(new Option(`All years (${b.c})`, ''));
    for (const a of ANOS) if (b.cy[a] || a === ano) s.add(new Option(`${a} (${b.cy[a] || 0})`, a));
    s.value = ano ? String(ano) : '';
    const box = $('p-lista'); box.textContent = ''; mostrados = 0;
    if (!k) { box.innerHTML = '<p class="vazio">The archive names no crossing point on this border.</p>'; return; }
    if (!n) { box.innerHTML = '<p class="vazio">No posts name its crossing points in the selected year.</p>'; return; }
    maisLinhas();
    if (rolaTopo) box.scrollTop = 0;
  }
  const marcaSel = () => { for (const x of L) x._el.classList.toggle('sel', x.id === sel); for (const b of bordas) b._el.classList.toggle('sel', b.id === selB); };
  function abreB(id, doIndice) {
    const b = porB[id]; if (!b) return;
    sel = null; selB = id; marcaSel();
    $('painel').classList.add('on'); montaPainelB(true);
    if (folha()) $('indice').classList.remove('on'), $('abre-indice').setAttribute('aria-expanded', 'false');
    escondeBoasVindas();
    const [x0, y0, x1, y1] = b.bx, centro = { x: M.lon0 + (x0 + x1) / 2 / M.kx, y: M.lat1 - (y0 + y1) / 2 / M.ky };
    centraliza(centro, doIndice ? Math.max(6, Math.min(30, (x1 - x0) / M.kx * 1.8, (y1 - y0) / M.ky * 2.4 + 4)) : null);
    fazHash(); aplica();
  }
  $('p-ano').onchange = e => defineAno(e.target.value ? +e.target.value : null);
  function abre(id, doIndice) {
    const l = byId(id); if (!l) return;
    if (ano && !l.cy[ano]) defineAno(null, false);
    sel = id; selB = null; marcaSel();
    $('painel').classList.add('on'); montaPainel(true);
    if (folha()) $('indice').classList.remove('on'), $('abre-indice').setAttribute('aria-expanded', 'false');
    escondeBoasVindas();
    centraliza(l, doIndice ? (l.t === 'pais' ? 30 : 22) : null);
    fazHash(); aplica();
  }
  function fecha() {
    sel = null; selB = null; $('painel').classList.remove('on'); marcaSel(); $('p-cruz').textContent = ''; fazHash(); aplica();
  }
  $('painel').querySelector('.fecha').onclick = fecha;
  $('p-link').onclick = () => {
    const b = $('p-link'), u0 = location.href;
    (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(u0) : Promise.reject()).then(() => b.textContent = 'Copied', () => b.textContent = 'Press ⌘/Ctrl+C on the address bar');
    setTimeout(() => b.textContent = 'Copy link', 2200);
  };
  addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('indice').classList.contains('on')) fechaIndice(); else if (sel || selB) fecha(); } });

  /* ---- índice em lista: alfabético, por país ---- */
  const corpo = $('indice-corpo');
  const grupos = {};
  for (const l of L) (grupos[l.t === 'mar' || l.p === '-' ? 'Seas' : l.p] ||= []).push(l);
  const nomesGrupo = Object.keys(grupos).sort((a, b) => a === 'Seas' ? 1 : b === 'Seas' ? -1 : a.localeCompare(b));
  const itens = [];
  const itensB = [];
  {
    const h = document.createElement('h3'); h.textContent = 'Borders'; const ul = document.createElement('ul'); corpo.append(h, ul);
    for (const b of bordas.filter(b => b.cruz.length || b.cerca).sort((p, q) => p.n.localeCompare(q.n))) {
      const li = document.createElement('li'), bt = document.createElement('button'); bt.type = 'button'; bt.dataset.b = b.id;
      bt.innerHTML = '<b style="font-weight:400"></b><span></span>'; bt.firstChild.textContent = b.n + (b.cerca ? ' (fenced)' : '');
      bt.onclick = () => abreB(b.id, true);
      li.appendChild(bt); ul.appendChild(li); itensB.push({ b, li, n: bt.lastChild, h });
    }
  }
  for (const g of nomesGrupo) {
    const h = document.createElement('h3'); h.textContent = g; const ul = document.createElement('ul');
    corpo.append(h, ul);
    for (const l of grupos[g].sort((a, b) => (a.t === 'pais' ? -1 : 0) - (b.t === 'pais' ? -1 : 0) || a.n.localeCompare(b.n))) {
      const li = document.createElement('li'), b = document.createElement('button'); b.type = 'button'; b.dataset.id = l.id;
      b.innerHTML = '<b style="font-weight:400"></b><span></span>'; b.firstChild.textContent = l.t === 'pais' ? `${l.n} (country only)` : l.n;
      b.onclick = () => abre(l.id, true);
      li.appendChild(b); ul.appendChild(li); itens.push({ l, li, n: b.lastChild, h, ul });
    }
  }
  const nada = document.createElement('p'); nada.className = 'nada'; nada.textContent = 'No place matches.'; nada.hidden = true; corpo.appendChild(nada);
  function atualizaIndice() {
    const q = norm($('busca').value.trim());
    let achou = 0;
    for (const it of itens) {
      const c = cont(it.l), vis = c > 0 && (!q || it.l.nn.includes(q) || norm(it.l.p).includes(q));
      it.li.classList.toggle('so', !vis); it.n.textContent = c.toLocaleString('en-US'); if (vis) achou++;
    }
    for (const it of itensB) {                         // fronteiras: sempre listadas (a cerca vale mesmo sem posts no ano)
      const vis = !q || it.b.nn.includes(q) || it.b.cruz.some(l => l.nn.includes(q));
      it.li.classList.toggle('so', !vis); it.n.textContent = contB(it.b).toLocaleString('en-US'); if (vis) achou++;
    }
    const gs = new Set([...itens, ...itensB].filter(i => !i.li.classList.contains('so')).map(i => i.h));
    corpo.querySelectorAll('h3').forEach(h => { h.style.display = gs.has(h) ? '' : 'none'; });
    nada.hidden = achou > 0;
  }
  $('busca').addEventListener('input', atualizaIndice);
  function fechaIndice() { $('indice').classList.remove('on'); $('abre-indice').setAttribute('aria-expanded', 'false'); }
  $('abre-indice').onclick = () => {
    const on = $('indice').classList.toggle('on'); $('abre-indice').setAttribute('aria-expanded', String(on));
    if (on) { if (folha()) $('painel').classList.remove('on'); setTimeout(() => $('busca').focus({ preventScroll: true }), 50); } else if (sel || selB) $('painel').classList.add('on');
  };
  $('indice').querySelector('.fecha').onclick = () => { fechaIndice(); if (sel || selB) $('painel').classList.add('on'); };

  /* ---- URL compartilhável: #lugar=idomeni&ano=2016 ---- */
  let travaHash = false;
  function fazHash() {
    const p = []; if (sel) p.push('lugar=' + sel); if (selB) p.push('fronteira=' + selB); if (ano) p.push('ano=' + ano);
    const h = p.join('&'); travaHash = true;
    try { history.replaceState(null, '', location.pathname + location.search + (h ? '#' + h : '')); } catch (e) { location.hash = h; }
    setTimeout(() => { travaHash = false; }, 0);
  }
  function lerHash() {
    const q = new URLSearchParams(location.hash.slice(1));
    const a = +q.get('ano'); defineAno(a && ANOS.includes(a) ? a : null, false);
    const id = q.get('lugar');
    const fb = q.get('fronteira');
    if (id && porId[id]) abre(id, true);
    else if (fb && porB[fb]) abreB(fb, true);
    else if (sel || selB) { sel = null; selB = null; $('painel').classList.remove('on'); marcaSel(); }
  }
  addEventListener('hashchange', () => { if (!travaHash) lerHash(); });

  /* ---- chegada vinda do tour ---- */
  function escondeBoasVindas() { const b = $('bv'); if (!b.hidden) { b.classList.remove('on'); setTimeout(() => { b.hidden = true; }, 400); } }
  $('bv').querySelector('button').onclick = escondeBoasVindas;
  const de = new URLSearchParams(location.search).get('de');
  if (de === 'tour') {
    $('bv-txt').textContent = `Every place the archive names, 2016–2025. Choose a point to read what was written there.`;
    $('bv').hidden = false; requestAnimationFrame(() => $('bv').classList.add('on'));
    const v = $('veu'); requestAnimationFrame(() => requestAnimationFrame(() => v.classList.add('fora')));
    setTimeout(() => v.remove(), 1900);
    setTimeout(escondeBoasVindas, 14000);
  } else $('veu').remove();

  view = vistaInicial(); acendeCercas(); atualizaIndice(); atualizaTotais();
  lerHash(); aplica();
  window.aysMapa = { lugares: () => L.map(l => ({ id: l.id, n: l.n, x: l.x, y: l.y, c: l.c })), abre: id => abre(id, false), ano: a => defineAno(a), vista: () => ({ ...view }), quadro: () => ({ w: M.w, h: M.h }), selecionado: () => sel, fronteira: () => selB, fronteiras: () => bordas.map(b => ({ id: b.id, n: b.n, encl: b.encl || null, cerca: b.cerca, cruz: b.cruz.map(l => l.id), c: b.c })), abreFronteira: id => abreB(id, false) };
})();
